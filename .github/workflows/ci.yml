name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest release the manifest supports, and the latest release.
        blender-version: ["5.1", "5.3"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: BradyAJohnston/setup-blender@v5
        with:
          version: ${{ matrix.blender-version }}

      - name: Install test dependencies
        run: python -m pip install --target .test-deps lxml svg.path

      - name: Run Blender regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/.test-deps
        run: >-
          blender --background --factory-startup --python-use-system-env
          --python-exit-code 1 --python tests/run.py

      - name: Validate extension manifest
        run: blender --command extension validate enhanced_svg
